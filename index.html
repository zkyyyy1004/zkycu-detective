<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>즈키쿠 탐정사무소 — 범인은 이 안에 있다</title>
<style>
  @font-face{font-family:'KbizHanmaumMyungjo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/KBIZHanmaumMyungjo.woff') format('woff');font-weight:normal;font-display:swap}
  :root{ --det:#7ee8c8;
    --bg:#0e0d14; --panel:#17161f; --panel2:#1f1e2a; --line:#2d2b3a;
    --text:#ece9f1; --muted:#9a96ad; --gold:#e6c15a; --red:#ff5d73; --green:#58d68d;
    --cuzky:#4a90e2; --timangyu:#d9d6ff; --cungzky:#ff8fb8; --cusiki:#ffd166; --malang:#ffb27a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #241f3a 0%, var(--bg) 60%);
    color:var(--text); font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;
  }
  #game{width:1280px;height:720px;position:relative;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;transform-origin:center}
  .screen{position:absolute;inset:0;display:none;flex-direction:column}
  .screen.active{display:flex}
  img.pix{image-rendering:pixelated;image-rendering:crisp-edges}

  /* top bar */
  #topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;
    background:linear-gradient(180deg,#1c1a28,#17161f);border-bottom:1px solid var(--line);font-size:14px}
  #topbar .title{color:var(--gold);font-weight:700;letter-spacing:.5px}
  #topbar .right{display:flex;gap:18px;color:var(--muted)}
  #topbar .score b{color:var(--text)}

  /* title screen */
  #title{align-items:center;justify-content:center;text-align:center;background:
    radial-gradient(800px 400px at 50% 30%, rgba(230,193,90,.08), transparent 70%)}
  #title h1{font-size:56px;letter-spacing:4px;color:var(--gold);text-shadow:0 0 30px rgba(230,193,90,.3)}
  #title h1 small{display:block;font-size:16px;letter-spacing:8px;color:var(--muted);margin-bottom:14px;font-weight:400}
  #title p{color:var(--muted);margin-top:14px;font-size:15px;line-height:1.7}
  .cast{display:flex;gap:40px;margin:36px 0 30px}
  .cast .c{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .cast img{height:110px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
  .btn{background:linear-gradient(180deg,#f0d272,#d4ad3e);color:#1b1708;border:none;padding:14px 38px;border-radius:10px;
    font-size:17px;font-weight:800;cursor:pointer;letter-spacing:1px;box-shadow:0 6px 0 #8f7320,0 10px 20px rgba(0,0,0,.4);transition:.08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8f7320}
  .btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px solid var(--line);font-weight:600}
  .btn.ghost:active{transform:none}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

  /* case select */
  #select{align-items:center;justify-content:flex-start;gap:24px;overflow-y:auto;padding:28px 0}
  #select h2{color:var(--gold);letter-spacing:3px}
  .cases{display:flex;gap:22px}
  .casecard{width:300px;min-height:220px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:22px;
    cursor:pointer;transition:.15s;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .casecard:hover{border-color:var(--gold);transform:translateY(-4px)}
  .casecard .ep{color:var(--gold);font-size:13px;letter-spacing:3px}
  .casecard h3{font-size:22px;margin-top:8px;line-height:1.35}
  .casecard .desc{color:var(--muted);font-size:13px;line-height:1.6}
  .casecard .stamp{position:absolute;right:16px;top:14px;border:2px solid var(--green);color:var(--green);
    font-size:12px;padding:2px 8px;border-radius:6px;transform:rotate(8deg);font-weight:800}
  .casecard.locked{opacity:.55;cursor:default}
  .casecard.locked:hover{border-color:var(--line);transform:none}
  .casecard .diff{color:var(--muted);font-size:11px;letter-spacing:0;margin-left:6px}
  .casecard .lockmsg{font-size:12px;color:var(--muted);margin-top:8px}
  .casecard .pwbox{display:flex;gap:6px;margin-top:8px}
  .casecard .pwbox input{flex:1;min-width:0;background:#0f0e15;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;font-family:inherit}
  .cases{flex-wrap:wrap;justify-content:center;max-width:1000px}
  .casecard .best{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}
  .casecard .rk{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-weight:900;font-size:17px;color:#1b1708;background:var(--gold)}
  .casecard .rk-A{background:#9fd8ff}.casecard .rk-B{background:#b8b4cc}.casecard .rk-C{background:#8a8699;color:#fff}

  /* play screen */
  #play{background:var(--panel)}
  #stage{flex:1;display:flex;min-height:0}
  #left{width:420px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    position:relative;background:linear-gradient(180deg,#13121b 0%,#1a1826 100%);overflow:hidden}
  #left::before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.012) 3px 4px)}
  #portrait{height:330px;transition:opacity .25s;filter:drop-shadow(0 20px 30px rgba(0,0,0,.7));margin-bottom:170px;z-index:1}
  #portrait.shake{animation:shake .4s}
  #portrait.dark{filter:brightness(.35) drop-shadow(0 20px 30px rgba(0,0,0,.7))}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
  /* 왼쪽 패널이 비었을 때(대사·현장 그림 없음) 이번 화 줄거리 요약 */
  #summary{position:absolute;inset:0;word-break:keep-all;z-index:2;display:none;flex-direction:column;justify-content:flex-start;gap:14px;padding:64px 34px 30px}
  #left.idle #summary{display:flex}
  #summary .lbl{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:800}
  #summary .ttl{font-size:22px;font-weight:800;color:#fff;line-height:1.35}
  #summary ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  #summary li{font-size:14.5px;line-height:1.6;color:#cfcbe0;padding-left:14px;position:relative}
  #summary li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  #summary em{font-style:normal;color:var(--gold);font-weight:800}
  #spot{position:absolute;top:110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(230,193,90,.18),transparent 70%);z-index:0}
  #mood small{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);margin-top:4px}
  #mood{position:absolute;top:16px;left:18px;font-size:20px;font-weight:800;color:var(--gold);letter-spacing:3px;z-index:2;text-shadow:0 2px 8px rgba(0,0,0,.6)}

  #right{flex:1;display:flex;flex-direction:column;min-width:0}
  #tabs{display:flex;border-bottom:1px solid var(--line);background:#14131c}
  #tabs button{flex:1;background:none;border:none;color:var(--muted);padding:14px;font-size:15px;cursor:pointer;
    border-bottom:3px solid transparent;font-family:inherit;font-weight:600;position:relative}
  #tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  #tabs button .badge{position:absolute;top:8px;right:14px;background:var(--red);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px}
  #content{flex:1;overflow:auto;padding:18px 22px 170px}
  #content::-webkit-scrollbar{width:8px}#content::-webkit-scrollbar-thumb{background:#2d2b3a;border-radius:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;transition:.12s;position:relative}
  .card:hover{border-color:var(--gold)}
  .card.done{border-color:#3b3950}
  .card.done::after{content:"✓";position:absolute;right:12px;top:10px;color:var(--green);font-weight:800}
  .card h4{font-size:15px;margin-bottom:4px}
  .card.spotc{display:flex;gap:14px;align-items:center}
  .card.spotc img{width:56px;height:56px;flex:none}
  #sceneImg{position:absolute;top:140px;width:220px;height:220px;z-index:1;filter:drop-shadow(0 16px 24px rgba(0,0,0,.7));display:none}
  .evflash img{width:72px;height:72px;margin-bottom:6px}
  .note li.ev img{width:28px;height:28px;vertical-align:middle;margin-right:8px}
  .card p{font-size:12.5px;color:var(--muted);line-height:1.5}
  .suspect{display:flex;gap:14px;align-items:center}
  .suspect img{height:64px}
  .suspect .n{font-weight:800;font-size:16px}
  .qlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .q{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;font-size:14.5px}
  .q:hover{border-color:var(--gold)}
  .q.done{color:var(--muted);border-style:dashed}
  .q.done::before{content:"✓ ";color:var(--green)}
  .back{color:var(--text);font-size:15px;font-weight:700;cursor:pointer;margin-bottom:14px;display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 16px}
  .back:hover{color:var(--gold);border-color:var(--gold)}

  .note h5{color:var(--gold);font-size:13px;letter-spacing:2px;margin:6px 0 10px}
  .note ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .note li{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13.5px;line-height:1.5;cursor:default}
  .note li .who{font-weight:800;margin-right:6px}
  .note li.sel{border-color:var(--gold);background:#2a2635}
  .note li.pick{cursor:pointer}.note li.pick:hover{border-color:var(--gold)}
  .note li.ev .who{color:var(--gold)}
  .note li .flag{color:var(--red);font-size:12px;margin-left:6px}
  .who.cuzky{color:var(--cuzky)}.who.timangyu{color:var(--timangyu)}.who.cungzky{color:var(--cungzky)}.who.cusiki{color:var(--cusiki)}.who.malang{color:var(--malang)}

  .deduce .step{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .deduce .step h5{color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:8px}
  .deduce .slot{min-height:40px;border:1px dashed #3b3950;border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
  .deduce .slot.filled{color:var(--text);border-style:solid;border-color:var(--gold)}
  .judgerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{white-space:nowrap}
  .accuse{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:10px}
  .accuse .a{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:.12s}
  .accuse .a:hover{border-color:var(--red);transform:translateY(-3px)}
  .accuse .a.sel{border-color:var(--red);background:#2a1f26;box-shadow:0 0 0 2px var(--red) inset}
  .accuse .a img{height:80px}
  .accuse .a div{margin-top:8px;font-weight:800}

  /* dialogue */
  #dlg{position:absolute;left:0;right:0;bottom:0;height:150px;border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(20,19,28,.96),rgba(15,14,21,.98));padding:16px 26px;cursor:pointer;display:none;z-index:20}
  #dlg.show{display:block}
  #dlg .name{font-weight:800;font-size:15px;margin-bottom:6px;letter-spacing:.5px}
  #dlg .text{font-size:17px;line-height:1.65;min-height:70px;white-space:pre-wrap}
  #dlg .text em{font-style:normal;font-family:"KbizHanmaumMyungjo","Gungsuh","궁서",serif;font-size:1.35em;font-weight:700;color:var(--gold);letter-spacing:1px;text-shadow:0 0 12px rgba(230,193,90,.35)}
  #dlg .next{position:absolute;right:26px;bottom:14px;color:var(--gold);font-size:13px;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.2}}

  /* result */
  #result{align-items:center;justify-content:center;text-align:center;gap:14px}
  #result h2{color:var(--gold);font-size:40px;letter-spacing:4px}
  #result .big{font-size:96px;font-weight:900;color:var(--gold);line-height:1;text-shadow:0 0 40px rgba(230,193,90,.35)}
  #result p{color:var(--muted);font-size:15px;line-height:1.7;max-width:640px}
  #result .row{display:flex;gap:14px;margin-top:10px}


  /* ── 모바일(세로) 반응형 ── */
  @media (max-width:899px){
    html,body{height:auto;overflow:auto;-webkit-overflow-scrolling:touch}
    body{display:block;min-height:100dvh}
    #game{width:100%;height:auto;min-height:100dvh;border-radius:0;border:none;box-shadow:none;transform:none!important;overflow:visible}
    .screen{position:static;inset:auto;min-height:100dvh}
    #topbar{position:sticky;top:0;z-index:30}
    #stage{display:block;flex:none;min-height:0;position:relative}
    #right{display:block}
    #content{overflow:visible;height:auto}
    #dlg{position:absolute;top:200px;bottom:auto;left:0;right:0;height:auto;min-height:150px;z-index:40;border-top:2px solid var(--gold);border-bottom:1px solid var(--line);padding:12px 14px 30px;box-shadow:0 14px 30px rgba(0,0,0,.6)}
    #toast{position:fixed;top:60px}
    .evflash{position:fixed}
    #topbar{height:44px;padding:0 10px;font-size:12px}
    #topbar .title{max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #topbar .right{gap:8px;white-space:nowrap}
    #topbar #phaseLabel{display:none}
    #stage{flex-direction:column}
    #left{width:100%;flex:none;height:200px;border-right:none;border-bottom:1px solid var(--line);justify-content:center}
    #portrait{height:150px;margin-bottom:0}
    #sceneImg{top:auto;width:140px;height:140px}
    #summary{justify-content:flex-start;gap:6px;padding:12px 16px;overflow:auto}
    #summary .lbl{font-size:11px}
    #summary .ttl{font-size:16px}
    #summary ul{gap:3px}
    #summary li{font-size:12.5px;line-height:1.45}
    #spot{top:30px;width:160px;height:160px}
    #mood{font-size:15px;top:10px;left:12px} #mood small{font-size:11px;margin-top:2px}
    #tabs button{font-size:13px;padding:10px 4px}
    #tabs button .badge{top:4px;right:6px}
    #content{padding:12px 12px 160px}
    .grid{grid-template-columns:1fr}
    .card.spotc img{width:44px;height:44px}
    .suspect img{height:52px}
    .q{font-size:14px;padding:11px 13px}
    .accuse{grid-template-columns:repeat(2,1fr)}
    .judgerow{flex-direction:column;align-items:stretch}
    .judgerow .btn{width:100%;padding:14px}
    .judgerow span{text-align:center}
    .accuse .a img{height:64px}
    #dlg{height:150px;padding:12px 14px 30px}
    #dlg .text{font-size:15px;line-height:1.55;min-height:0}
    #dlg .name{font-size:13px;margin-bottom:4px}
    #dlg .next{right:14px;bottom:8px;font-size:12px}
    #title{padding:20px 16px;justify-content:flex-start;overflow:auto}
    #title h1{font-size:30px;letter-spacing:2px;margin-top:20px}
    #title h1 small{font-size:11px;letter-spacing:4px}
    #title p{font-size:13px}
    .cast{gap:10px;margin:22px 0 20px;flex-wrap:wrap;justify-content:center}
    .cast img{height:70px}
    .cast .c{font-size:12px}
    #select{padding:20px 16px;justify-content:flex-start;overflow:auto;gap:14px}
    .cases{flex-direction:column;width:100%}
    .casecard{width:100%;height:auto;gap:10px;padding:16px}
    .casecard h3{font-size:18px}
    #result{padding:20px}
    #result h2{font-size:28px}
    #result .big{font-size:72px}
    .evflash{min-width:0;width:86%;padding:16px}
  }
  #toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:#2a2635;border:1px solid var(--gold);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  .evflash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);background:#1f1e2a;border:2px solid var(--gold);
    border-radius:14px;padding:22px 30px;z-index:60;text-align:center;min-width:360px;opacity:0;transition:.2s;pointer-events:none}
  .evflash.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .evflash small{color:var(--gold);letter-spacing:3px;font-size:12px}
  .evflash h4{font-size:20px;margin:6px 0}
  .evflash p{color:var(--muted);font-size:13.5px;line-height:1.5}

  /* 추리 탭: 선택 칸 + 버튼을 위에 고정 */
  .dbar{position:sticky;top:-18px;z-index:5;background:var(--panel);padding:28px 0 10px;margin-top:-18px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .dslots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dslots .slot{cursor:pointer}
  .dslots .slot b{display:block;color:var(--gold);font-size:12px;letter-spacing:1px;margin-bottom:4px}
  .dslots .slot.now{border-style:solid;border-color:var(--det);box-shadow:0 0 0 1px var(--det) inset}
  .dbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .dbtns .btn{padding:10px 22px;font-size:15px}
  .dbtns span{color:var(--muted);font-size:13px}
  .dguide{color:var(--gold);font-size:13px;margin-bottom:8px}

  /* 추리 탭 색 맞춤: ① 거짓 = 빨강, ② 근거 = 민트 */
  .dslots .slot.lie b{color:var(--red)}
  .dslots .slot.proof b{color:var(--det)}
  .dslots .slot.lie.filled{border-color:var(--red);background:#2a1f26}
  .dslots .slot.proof.filled{border-color:var(--det);background:#1c2a28}
  .dslots .slot.lie.now{border-style:solid;border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
  .dslots .slot.proof.now{border-style:solid;border-color:var(--det);box-shadow:0 0 0 2px var(--det) inset}
  .note li.sel-lie{border-color:var(--red);background:#2a1f26}
  .note li.sel-proof{border-color:var(--det);background:#1c2a28}
  .note li.pick.sel-lie:hover{border-color:var(--red)}
  .note li.pick.sel-proof:hover{border-color:var(--det)}
  .note li.sel-lie::after{content:"① 거짓";color:var(--red);font-size:12px;font-weight:800;margin-left:8px;white-space:nowrap}
  .note li.sel-proof::after{content:"② 근거";color:var(--det);font-size:12px;font-weight:800;margin-left:8px;white-space:nowrap}

  /* 수첩 구역 색: 진술 / 증거 */
  .note h5.h-st{color:#9fd8ff}
  .note h5.h-ev{color:var(--gold)}
  .note ul.u-st li{border-left:3px solid #9fd8ff}
  .note ul.u-ev li{border-left:3px solid var(--gold)}
  .note ul li.sel-lie{border-color:var(--red)}
  .note ul li.sel-proof{border-color:var(--det)}

  /* 대사가 나오는 동안에는 탭·목록을 누를 수 없게 */
  #play.talking #tabs,#play.talking #content{pointer-events:none}
  /* 대사 '이전' 버튼 */
  #dlg .prev{position:absolute;right:100px;bottom:8px;color:var(--muted);font-size:13px;padding:6px 10px;cursor:pointer;border:1px solid var(--line);border-radius:8px;background:rgba(31,30,42,.9)}
  #dlg .prev:hover{color:var(--gold);border-color:var(--gold)}

  /* 모바일 보정: 위 기본 규칙(#toast, .evflash)보다 뒤에 있어야 적용됨 */
  @media (max-width:899px){
    #toast{position:fixed;top:60px}
    .evflash{position:fixed;min-width:0;width:86%;padding:16px}
    .casecard{min-height:0}
    #dlg .prev{right:74px;bottom:3px;font-size:12px;padding:5px 8px}
    body{overflow:visible}

/* ── 암호화 해금 (WebCrypto AES-GCM + PBKDF2) ── */
async function decryptCase(b64, pw){
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)); const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function tryUnlock(id, pw, quiet){
  const L=LOCKED.find(l=>l.id===id); if(!L) return false;
  try{ const c=normalize(await decryptCase(L.enc,pw.trim())); if(!CASES.find(x=>x.id===c.id)) CASES.push(c); localStorage.setItem('zkycu_key'+id,pw.trim()); if(!quiet){ sfx('evidence'); goSelect(); toastSel('사건 파일이 열렸다.'); unlockSaved(); } else if(document.getElementById('select').classList.contains('active')) goSelect(); return true; }
  catch(e){ if(!quiet){ sfx('wrong'); toastSel('비밀번호가 틀렸다.'); } return false; }
}

async function unlockSaved(){ const pws=new Set(LOCKED.map(L=>localStorage.getItem('zkycu_key'+L.id)).filter(Boolean)); for(const L of LOCKED){ if(CASES.find(c=>c.id===L.id)) continue; for(const pw of pws){ if(await tryUnlock(L.id,pw,true)) break; } } }

function cheatTap(){ cheatN++; clearTimeout(cheatT); cheatT=setTimeout(()=>cheatN=0,1500); if(cheatN>=7){ cheatN=0; [1,2,3].forEach(x=>{ if(!state.cleared.includes(x)) state.cleared.push(x); }); save(); goSelect(); toastSel('시즌 1 클리어 처리됨 (치트)'); sfx('evidence'); } }

// *강조* 문법 → <em>. 글자 단위로 세그먼트화해서 타이핑 중에도 강조 유지
function parseEmph(text){ const seg=[]; let em=false; for(const ch of text){ if(ch==='*'){ em=!em; continue; } seg.push([ch,em]); } return seg; }
function renderSeg(seg,n){ let h='',open=false; const esc=c=>c==='<'?'&lt;':c==='&'?'&amp;':c; for(let i=0;i<n&&i<seg.length;i++){ const [c,e]=seg[i]; if(e&&!open){h+='<em>';open=true;} if(!e&&open){h+='</em>';open=false;} h+=esc(c); } if(open) h+='</em>'; return h; }
let curSeg=[];

/* ── 추리 ── */
function renderDeduce(el){
  if(!canDeduce()){ el.innerHTML=`<div class="deduce"><div class="step"><h5>아직 이르다</h5><p style="color:var(--muted);font-size:14px;line-height:1.6">진술이 하나도 없다. 최소한 누군가는 심문해야 한다.<br><span style="color:var(--gold)">질문은 하나당 -3점. 적게 묻고 맞출수록 명탐정.</span></p></div></div>`; return; }
  if(S.phase==='accuse'){ renderAccuse(el); return; }
  const lie=S.statements.find(s=>s.id===S.lieSel), pr=[...S.statements,...S.evidence].find(x=>x.id===S.proofSel);
  const mode=!lie?'lie':(S.pickMode||'proof');
  const label=x=>x? (x.who?`<span class="who ${x.who}">${CHARS[x.who].name}</span> ${x.text}`:`<span class="who" style="color:var(--gold)">증거</span> ${x.title}`) : '';
  el.innerHTML=`<div class="deduce">
    <div class="dbar">
      <div class="dslots">

        <div class="slot proof ${pr?'filled':''} ${mode==='proof'?'now':''}" onclick="S.pickMode='proof';render()"><b>② 깨뜨리는 근거</b>${pr?label(pr):'아래에서 진술·증거를 클릭'}</div>
      </div>
      <div class="dbtns"><button class="btn" ${lie&&pr?'':'disabled'} onclick="judge()">이의 있음!</button><button class="btn ghost" ${S.hintOn?'disabled':''} onclick="buyHint()">${S.hintOn?'힌트 사용함':'힌트 보기 (-5)'}</button><span>${C.stages.length>1?`[모순 ${S.stage+1}/${C.stages.length}] `:''}${S.hintOn?'힌트: '+C.stages[S.stage].lieHint:'틀리면 -10점.'}</span></div>
    </div>
    <p class="dguide">${mode==='lie'?'① 거짓이라고 생각하는 진술을 클릭':'② 그 거짓을 깨뜨리는 진술·증거를 클릭 (①을 바꾸려면 위 ① 칸을 누르기)'}</p>
    <div id="pickArea"></div></div>`;
  renderNote(document.getElementById('pickArea'),true,mode);
}
function pickNote(id,mode){
  if(mode==='lie'){ S.lieSel=id; if(S.proofSel===id) S.proofSel=null; S.pickMode='proof'; }
  else { if(id===S.lieSel) return; S.proofSel=id; S.pickMode=null; }
  sfx('click'); render();
}
function buyHint(){ if(S.hintOn) return; S.hintOn=true; S.score=Math.max(0,S.score-5); updateScore(); sfx('note'); render(); }
function judge(){
  const st=C.stages[S.stage];
  const ok = st.lie.includes(S.lieSel) && st.proof.includes(S.proofSel);
  const later = !ok && C.stages.slice(S.stage+1).some(x=>x.lie.includes(S.lieSel)&&x.proof.includes(S.proofSel));
  if(ok){
    const last = S.stage===C.stages.length-1;
    S.phase='reveal'; setPhase('추궁'); const who=S.statements.find(s=>s.id===S.lieSel).who; setPortrait(who); sfx('objection');
    say(tag(st.reveal,`c${C.id}_reveal${S.stage?S.stage+1:''}`), ()=>{
      if(last){ S.phase='accuse'; setPhase('범인 지목'); setPortrait(null); render(); return; }
      if(st.unlock){ S.extraQ[st.unlock.who]=(S.extraQ[st.unlock.who]||[]).concat([st.unlock.q]); toast(`${CHARS[st.unlock.who].name}에게 새 질문이 생겼다.`); sfx('note'); }
      S.stage++; S.lieSel=null; S.proofSel=null; S.hintOn=false; S.phase='investigate'; setPhase('수사 중'); setPortrait(null); render();
    });
  } else if(later){
    S.lieSel=null; S.proofSel=null; setPortrait('cuzky');
    say([['cuzky','…그 모순은 맞다. 하지만 그 전에 먼저 걷어내야 할 거짓말이 있다. 순서대로 가지, 탐정님.','common_tooearly']], render);
  } else {
    S.score=Math.max(0,S.score-10); updateScore(); S.lieSel=null; S.proofSel=null; sfx('wrong');
    setPortrait('cuzky'); say([['cuzky','…그 둘은 *서로 모순되지 않는다.* 다시 수첩을 봐, 탐정님.','common_wrongpair']], render);
  }
}
function culpritSet(){ return C.culprits || [C.culprit]; }
function renderAccuse(el){
  const multi=culpritSet().length>1, hide=!!C.hideCount, need=culpritSet().length; S.pick=S.pick||[];
  el.innerHTML=`<div class="deduce"><div class="step"><h5>범인을 지목하라${multi&&!hide?` — <span style="color:var(--red)">${need}명</span>`:''}</h5><p style="color:var(--muted);font-size:14px">틀리면 -15점. 쿠식이들과 상의해도 좋다.${multi?(hide?' 범인이 몇 명인지는 모른다. 범인이라고 생각하는 사람을 모두 고른 뒤 지목 버튼.':` 범인은 한 명이 아니다. ${need}명을 고른 뒤 지목 버튼.`):''}</p></div>
  <div class="accuse">`+ORDER.map(k=>`<div class="a ${S.pick.includes(k)?'sel':''}" onclick="${multi?`togglePick('${k}')`:`accuse(['${k}'])`}"><img src="${CHARS[k].img}"><div class="who ${k}">${CHARS[k].name}</div></div>`).join('')+`</div>
  ${multi?`<div style="margin-top:14px"><button class="btn" ${(hide?S.pick.length>0:S.pick.length===need)?'':'disabled'} onclick="accuse(S.pick.slice())">${hide?(S.pick.length===ORDER.length?'전원을':`이 ${S.pick.length}명을`):`이 ${need}명을`} 지목한다</button></div>`:''}</div>`;
}
function togglePick(k){ S.pick=S.pick||[]; if(S.pick.includes(k)) S.pick=S.pick.filter(x=>x!==k); else if(S.pick.length<(C.hideCount?ORDER.length:culpritSet().length)) S.pick.push(k); sfx('click'); render(); }
function accuse(ks){
  const cs=culpritSet(), ok= ks.length===cs.length && ks.every(k=>cs.includes(k));
  const k = ok ? ks[0] : (ks.find(x=>!cs.includes(x)) || ks[0]);
  setPortrait(k); S.pick=[];
  const names=ks.map(x=>CHARS[x].name).join('와 ');
  if(ok){
    setPhase('자백'); sfx('correct'); say([[D,`범인은… *${names}*, ${ks.length===ORDER.length?'너희 전원이다.':ks.length>1?'너희다.':'너다.'}`,`c${C.id}_accuse_${k}`],...tag(C.confession,`c${C.id}_confession`)], finishCase);
  } else {
    S.score=Math.max(0,S.score-15); updateScore();
    sfx('wrong'); say([[D,`범인은… *${names}*!`,`c${C.id}_accuse_${k}`],[k,C.wrong[k],`c${C.id}_wrong_${k}`]], ()=>{ setPortrait(null); render(); });
  }
}
function finishCase(){
  if(!state.cleared.includes(C.id)) state.cleared.push(C.id);
  const sc=S.score, rank=rankOf(sc); sfx('clear');
  if(!state.best[C.id] || sc>state.best[C.id].score) state.best[C.id]={score:sc, rank, q:askedCount()};
  save();
  const titles={S:'명탐정 즈키쿠',A:'유능한 탐정',B:'끈기의 탐정',C:'만년 용기사급 탐정'};
  document.getElementById('rRank').textContent=rank;
  document.getElementById('rTitle').textContent=`${C.ep} 해결`;
  const s1done=[1,2,3].every(x=>state.cleared.includes(x));
  document.getElementById('rText').innerHTML=`탐정 점수 <b style="color:var(--text)">${sc}</b> · 질문 ${askedCount()}개 — 칭호 「${titles[rank]}」<br>${C.id>=10?'시즌 3 완료. 즈키쿠 탐정사무소의 모든 사건을 해결했다. — 수고했어, 탐정님.':C.id>=7?'시즌 3 사건을 해결했다. 다음 사건 파일이 열렸다 — 비밀번호가 필요하다.':C.id>=4?(C.id>=6?'시즌 2 완료. 시즌 3 제7화 파일이 열렸다 — 비밀번호가 필요하다.':'시즌 2 사건을 해결했다. 다음 사건 파일이 열렸다 — 비밀번호가 필요하다.'):(s1done?'시즌 1 완료. 제4화 파일이 열렸다 — 비밀번호: <b style="color:var(--gold)">CZ0203</b>':'다음 사건 파일이 열렸다.')}`;
  if(C.id<=3 && s1done && !localStorage.getItem('zkycu_epi')){
    localStorage.setItem('zkycu_epi','1'); show('play'); setPortrait(null); say(tag(EPILOGUE,'epi'), ()=>show('result'));
  } else show('result');
}


/* =========================================================
   오디오: 효과음(WebAudio 합성) + 음성(voice/대사id.mp3 자동 재생)
   ========================================================= */
let AC=null, muted=localStorage.getItem('zkycu_mute')==='1', curVoice=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f,d,type='square',vol=.08,t0=0,slide=0){ const a=ac(); if(!a||muted) return; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,a.currentTime+t0); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+t0+d); g.gain.setValueAtTime(vol,a.currentTime+t0); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t0+d); o.connect(g).connect(a.destination); o.start(a.currentTime+t0); o.stop(a.currentTime+t0+d+.02); }
function noise(d,vol=.15,t0=0){ const a=ac(); if(!a||muted) return; const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate), x=b.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=(Math.random()*2-1)*(1-i/x.length); const s=a.createBufferSource(); s.buffer=b; const g=a.createGain(); g.gain.value=vol; const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; s.connect(f).connect(g).connect(a.destination); s.start(a.currentTime+t0); }
const SFX={
  click:   ()=>tone(900,.04,'square',.04),
  note:    ()=>{ tone(660,.07,'square',.06); tone(990,.09,'square',.06,.07); },
  evidence:()=>{ tone(523,.1,'triangle',.1); tone(659,.1,'triangle',.1,.1); tone(784,.18,'triangle',.1,.2); },
  objection:()=>{ noise(.25,.25); tone(220,.35,'sawtooth',.12,0,-150); tone(110,.4,'square',.1,.05); },
  correct: ()=>{ [523,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.08,i*.1)); tone(1047,.4,'triangle',.08,.4); },
  wrong:   ()=>{ tone(200,.25,'sawtooth',.1,0,-80); tone(150,.3,'square',.08,.12,-60); },
  clear:   ()=>{ [392,523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.08,i*.09)); tone(1319,.6,'triangle',.1,.5); },
};
function unlockAudio(){ const a=ac(); if(!a) return; try{ const o=a.createOscillator(), g=a.createGain(); g.gain.value=0.0001; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+.05); }catch(e){} sfx('note'); }
function sfx(n){ try{ SFX[n]&&SFX[n](); }catch(e){} }
function toggleMute(){ muted=!muted; localStorage.setItem('zkycu_mute',muted?'1':'0'); document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'; if(muted&&curVoice){ curVoice.pause(); } bgmApply(); }
document.addEventListener('DOMContentLoaded',()=>{ document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'; bgmIcon(); });
// 음성: voice/<대사id>.mp3 가 있으면 재생, 없으면 조용히 무시 (wav도 시도)
function playVoice(id){
  if(curVoice){ curVoice.pause(); curVoice=null; }
  if(!id||muted) return;
  const tryPlay=(ext,next)=>{ const a=new Audio(`voice/${id}.${ext}`); a.onerror=()=>{ if(next) next(); }; a.onended=a.onpause=()=>{ if(curVoice===a||!curVoice) bgmDuck(false); }; a.play().then(()=>{ curVoice=a; bgmDuck(true); }).catch(()=>{ if(next) next(); }); };
  tryPlay('mp3', ()=>tryPlay('wav', null));
}

/* =========================================================
   BGM: 수사 중(investigate) / 추궁(reveal) / 자백(confession)
   - 기본은 WebAudio 합성 (파일 없음)
   - bgm/investigate.mp3 · bgm/reveal.mp3 · bgm/confession.mp3 가 있으면 그 파일을 반복 재생
   - 🎵 버튼 = BGM만 끄기 (localStorage zkycu_bgm), 🔊 = 전체 음소거
   - 음성 파일 재생 중엔 BGM 볼륨 자동으로 낮춤
   ========================================================= */
const BGM_VOL=0.32;   // 합성 BGM 전체 볼륨 (0~1)
const BGM_FILE_VOL=0.45; // 파일 BGM 볼륨
let bgmOn=localStorage.getItem('zkycu_bgm')!=='0', bgmWant=null, bgmCur=null, bgmBus=null, bgmTimer=null, bgmStep=0, bgmNext=0, bgmFile=null, bgmFileOk={}, bgmDucked=false, bgmNoiseBuf=null, bgmTok=0;
const m2f=m=>440*Math.pow(2,(m-69)/12);
// 화음 → 8분/16분 아르페지오
function arp(chords,every,len=16){ const o=[]; chords.forEach((ch,b)=>{ for(let s=0,k=0;s<len;s+=every,k++) o.push([b*len+s, ch[k%ch.length], every]); }); return o; }
const BGM={
  // 수사 중 — A단조, 잔잔하고 수상한 분위기 (Am-F-Dm-E)
  investigate:{ bpm:88, len:64, tracks:[
    {type:'triangle', vol:.5, notes:[[0,45,6],[6,45,2],[10,52,4],[16,41,6],[22,41,2],[26,48,4],[32,38,6],[38,38,2],[42,45,4],[48,40,6],[54,40,2],[58,44,4]]},
    {type:'triangle', vol:.16, notes:arp([[69,72,76,72],[65,69,72,69],[62,65,69,65],[64,68,71,68]],2)},
    {type:'square', vol:.07, legato:.8, notes:[[0,76,6],[8,74,4],[12,72,4],[16,72,8],[24,69,8],[32,74,6],[38,77,6],[44,76,4],[48,68,8],[56,71,4],[60,74,4]]},
    {drum:'hat', vol:.05, steps:[4,12]},
  ]},
  // 추궁 — D단조, 빠르고 몰아붙이는 느낌 (Dm-Dm-Bb-A)
  reveal:{ bpm:140, len:64, tracks:[
    {type:'sawtooth', vol:.22, legato:.7, notes:arp([[38,38,50,38],[38,38,50,38],[34,34,46,34],[33,33,45,40]],2)},
    {type:'square', vol:.09, legato:.75, notes:[[0,74,2],[3,74,2],[6,77,2],[8,81,4],[12,79,4],[16,77,4],[20,76,4],[24,74,4],[28,73,4],[32,70,4],[36,74,4],[40,77,4],[44,82,4],[48,81,8],[56,79,4],[60,76,4]]},
    {type:'triangle', vol:.12, notes:arp([[62,65,69],[62,65,69],[58,62,65],[57,61,64]],4)},
    {drum:'kick', vol:.5, steps:[0,8,10]},
    {drum:'snare', vol:.16, steps:[4,12]},
    {drum:'hat', vol:.04, steps:[0,2,4,6,8,10,12,14]},
  ]},
  // 자백 — 느리고 쓸쓸하게 (F-G-Em-Am)
  confession:{ bpm:70, len:64, tracks:[
    {type:'triangle', vol:.45, notes:[[0,41,16],[16,43,16],[32,40,16],[48,45,16]]},
    {type:'triangle', vol:.13, notes:arp([[65,69,72,76],[67,71,74,79],[64,67,71,76],[69,72,76,81]],2)},
    {type:'triangle', vol:.26, legato:.95, notes:[[0,69,8],[8,72,4],[12,76,4],[16,74,12],[28,71,4],[32,67,8],[40,71,4],[44,76,4],[48,72,16]]},
  ]},
};
Object.values(BGM).forEach(T=>{ T.map={}; T.tracks.forEach(tr=>{ if(tr.notes) tr.notes.forEach(n=>{ (T.map[n[0]]=T.map[n[0]]||[]).push([tr,n]); }); }); });

function bgmTone(f,d,type,vol,t){ const a=AC, o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.setTargetAtTime(.0001,t+Math.max(.02,d*.85),.05); o.connect(g).connect(bgmBus); o.start(t); o.stop(t+d+.3); }
function bgmDrum(kind,t,vol){ const a=AC;
  if(kind==='kick'){ const o=a.createOscillator(), g=a.createGain(); o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+.12); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(g).connect(bgmBus); o.start(t); o.stop(t+.2); return; }
  if(!bgmNoiseBuf){ bgmNoiseBuf=a.createBuffer(1,a.sampleRate*.2,a.sampleRate); const x=bgmNoiseBuf.getChannelData(0); for(let i=0;i<x.length;i++) x[i]=Math.random()*2-1; }
  const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=bgmNoiseBuf;
  f.type=kind==='hat'?'highpass':'bandpass'; f.frequency.value=kind==='hat'?7000:1800;
  const d=kind==='hat'?.04:.12; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f).connect(g).connect(bgmBus); s.start(t); s.stop(t+d+.02);
}
function bgmTick(){ const a=AC; if(!a||!bgmCur||!bgmBus) return; const T=BGM[bgmCur], sp=60/T.bpm/4;
  while(bgmNext < a.currentTime+.15){ const st=bgmStep%T.len;
    (T.map[st]||[]).forEach(([tr,n])=>bgmTone(m2f(n[1]), n[2]*sp*(tr.legato||.9), tr.type, tr.vol, bgmNext));
    T.tracks.forEach(tr=>{ if(tr.drum && tr.steps.includes(st%16)) bgmDrum(tr.drum,bgmNext,tr.vol); });
    bgmStep++; bgmNext+=sp; }
}
function bgmStop(){
  bgmTok++;
  if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; }
  if(bgmBus&&AC){ const b=bgmBus; b.gain.setTargetAtTime(.0001,AC.currentTime,.15); setTimeout(()=>{ try{ b.disconnect(); }catch(e){} },900); }
  bgmBus=null;
  if(bgmFile){ const f=bgmFile; bgmFile=null; let v=f.volume; const iv=setInterval(()=>{ v-=.05; if(v<=0){ clearInterval(iv); f.pause(); } else f.volume=v; },40); }
  bgmCur=null;
}
function bgmSynth(name){ const a=ac(); if(!a) return; bgmCur=name; bgmBus=a.createGain(); bgmBus.gain.setValueAtTime(.0001,a.currentTime); bgmBus.gain.setTargetAtTime(BGM_VOL*(bgmDucked?.35:1),a.currentTime,.3); bgmBus.connect(a.destination); bgmStep=0; bgmNext=a.currentTime+.08; bgmTick(); bgmTimer=setInterval(bgmTick,25); }
function bgmStart(name){
  bgmCur=name; const tok=++bgmTok;
  if(bgmFileOk[name]===false){ bgmSynth(name); return; }
  const f=new Audio(`bgm/${name}.mp3`); f.loop=true; f.volume=BGM_FILE_VOL*(bgmDucked?.35:1);
  f.onerror=()=>{ bgmFileOk[name]=false; if(tok===bgmTok && bgmCur===name && !bgmBus) bgmSynth(name); };
  f.play().then(()=>{ if(tok!==bgmTok || bgmCur!==name){ f.pause(); return; } bgmFileOk[name]=true; bgmFile=f; }).catch(()=>{});
}
function bgmApply(){ const want=(bgmOn&&!muted)?bgmWant:null; if(want===bgmCur) return; bgmStop(); if(want) bgmStart(want); }
function bgm(name){ bgmWant=name||null; bgmApply(); }
function bgmDuck(on){ bgmDucked=on; if(bgmBus&&AC) bgmBus.gain.setTargetAtTime(BGM_VOL*(on?.35:1),AC.currentTime,.12); if(bgmFile) bgmFile.volume=BGM_FILE_VOL*(on?.35:1); }
function bgmIcon(){ const b=document.getElementById('bgmBtn'); if(b){ b.textContent='🎵'; b.style.opacity=bgmOn?1:.35; b.style.textDecoration=bgmOn?'':'line-through'; } }
function toggleBgm(){ bgmOn=!bgmOn; localStorage.setItem('zkycu_bgm',bgmOn?'1':'0'); bgmIcon(); bgmApply(); }

/* ── 화면 비율 자동 맞춤 (OBS/브라우저 크기 대응) ── */
function fit(){ const g=document.getElementById('game'); if(window.innerWidth<900){ g.style.transform=''; return; } const s=Math.min(window.innerWidth/1300, window.innerHeight/740, 1); g.style.transform=`scale(${s})`; }
window.addEventListener('resize',fit); fit();
/* ── 현장 아이콘 파일이 없으면 기본 아이콘으로 대체 ── */
const FALLBACK_ICON='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="#2a2635"/><text x="32" y="44" font-size="34" text-anchor="middle">🔍</text></svg>');
document.addEventListener('error',e=>{ const t=e.target; if(t&&t.tagName==='IMG'&&t.classList.contains('pix')&&t.getAttribute('src')!==FALLBACK_ICON) t.src=FALLBACK_ICON; },true);
</script>
